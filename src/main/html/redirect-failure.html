<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication failed</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
        color: #1f2937;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 2rem 2.5rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Authentication failed</h1>
      <p>The app could not complete sign-in. Please try again.</p>
    </div>
  </body>
</html>
